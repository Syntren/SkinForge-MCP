[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "skinforge-mcp"
version = "3.0.0"
description = "Autonomous Model Context Protocol (MCP) server & procedural engine for Minecraft skin authoring, validation, and real-time 3D preview."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Syntren"}
]
keywords = ["minecraft", "skin", "mcp", "ai-agent", "model-context-protocol", "threejs", "webgl", "pixel-art"]
dependencies = [
    "numpy>=1.22.0",
    "pillow>=9.0.0",
    "mcp>=1.0.0"
]

[project.urls]
Homepage = "https://github.com/Syntren/SkinForge-MCP"
Repository = "https://github.com/Syntren/SkinForge-MCP"
Issues = "https://github.com/Syntren/SkinForge-MCP/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.20.0"
]

[project.scripts]
skinforge = "cli:main"
skinforge-mcp = "skinforge.mcp_server:main"
skinforge-viewer = "viewer:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["skinforge*"]

[tool.setuptools.package-data]
skinforge = ["*.md"]
